name: 'pgrx initialization'
description: 'Initialize PGRX if it is a dependency, otherwise do nothing.'
inputs:
  working-directory:
    description: 'The directory in which there is a pgrx extension project'
    required: true
  pg-version:
    description: 'PostgreSQL feature to initialize; defaults to the extension default'
    required: false
    default: ''
outputs: {}
runs:
  using: "composite"
  steps:
      - name: Install TOML parser
        shell: bash
        run: |
         set -xe
         wget https://github.com/freshautomations/stoml/releases/download/v0.7.1/stoml_linux_amd64 &> /dev/null
         mv stoml_linux_amd64 stoml
         chmod +x stoml
         sudo mv stoml /usr/local/bin/
         sudo apt-get update && sudo apt-get install -y libreadline-dev
      - name: setup pgrx
        shell: bash
        id: pgrx_install
        working-directory: ${{ inputs.working-directory }}
        run: |
          pgrx_version=$(stoml Cargo.toml dependencies.pgrx)
          if [ -z "${pgrx_version}" ]; then
            echo "pgrx is not a dependency: skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            cargo install --version ${pgrx_version} cargo-pgrx --locked
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: pgrx init
        shell: bash
        if: steps.pgrx_install.outputs.skip == 'false'
        working-directory: ${{ inputs.working-directory }}
        env:
          PG_VERSION: ${{ inputs.pg-version }}
        run: |
          set -x
          pg_version=${PG_VERSION:-$(stoml Cargo.toml features.default)}
          # Reuse the requested PostgreSQL installation when it is cached.
          if pg_config=$(cargo pgrx info pg-config "$pg_version") && [ -x "$pg_config" ]; then
            echo "Already found pgrx is initialized. Skipping 'cargo pgrx init' command."
          else
            cargo pgrx init --${pg_version} download
          fi
