name: Extension Upgrade

defaults:
  run:
    shell: bash
    working-directory: ./extension

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/extension_upgrade.yml"
      - ".github/actions/pgx-init/**"
      - "extension/**"

jobs:
  test:
    name: Upgrade Test
    runs-on:  ubuntu-24.04
    services:
      vector-serve:
        image: ghcr.io/chuckhend/vector-serve:latest
        ports:
          - 3000:3000
    steps:
      - name: Checkout repository content
        uses: actions/checkout@v6

      - name: Install Rust stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "extension-upgrade-test"
          workspaces: |
            vectorize
          # Additional directories to cache
          cache-directories: |
            /home/runner/.pgrx
      - name: Get current version
        id: current-version
        run: echo "CI_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install sys dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-server-dev-16 libopenblas-dev libreadline-dev
      - uses: ./.github/actions/pgx-init
        with:
          working-directory: ./extension
          pg-version: pg17
      - name: Install project dependencies
        run: |
          make setup PG_VERSION=17
      - name: Test previous version (v0.20.0)
        run: |
          git fetch --tags
          git checkout tags/v0.20.0
          # pgrx=0.12.5 required for v0.20.0
          cargo install cargo-pgrx --version 0.12.5 --locked
          cargo pgrx install --pg-config "$(cargo pgrx info pg-config pg17)"
          # Seed the persistent upgrade fixture using the local embedding service.
          make test-integration PG_VERSION=17 TEST_NAME=test_static
      - name: Test branch's version
        env:
          CI_COMMIT: ${{ steps.current-version.outputs.CI_COMMIT }}
        run: |
          git checkout "$CI_COMMIT"
          make test-update PG_VERSION=17
      - name: Debugging information
        if: always()
        env:
          CI_COMMIT: ${{ steps.current-version.outputs.CI_COMMIT }}
        run: |
          git checkout "$CI_COMMIT"
          make cat-logs PG_VERSION=17
